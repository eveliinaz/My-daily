<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171622"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="My Daily"><meta name="description" content="Free offline task and habit tracker"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="stylesheet" href="./style.css"><title>My Daily · Tasks & habits</title></head><body><main class="shell"><header><div><span class="eyebrow">MY DAILY</span><h1>My Daily Tasks</h1><p id="date-label"></p></div><span class="avatar">MD</span></header><section class="stats"><div class="statline"><strong>Daily progress</strong><span id="progress-label">0 of 0 done</span></div><div class="track"><div id="progress-bar"></div></div><p>Keep going. One task at a time.</p></section><nav class="tabs" aria-label="Task filter"><button data-tab="today" class="active">Today</button><button data-tab="upcoming">Upcoming</button><button data-tab="all">All tasks</button><button data-tab="calendar">Calendar</button></nav><section class="section-head"><h2 id="list-title">Today's tasks</h2><span id="task-count"></span></section><div id="task-list" aria-live="polite"></div><section class="instructions"><strong>Reminders</strong><p id="push-status">To receive Lock Screen reminders, connect the free reminder server and enable notifications on your installed Home Screen app.</p><button id="push-enable" type="button" class="primary">Enable notifications</button><button id="push-disable" type="button" class="secondary" hidden>Disable notifications</button></section></main><button class="fab" id="open-form">+ Add task</button><dialog id="task-dialog"><form id="task-form" method="dialog"><div class="dialog-head"><h2 id="dialog-title">New task</h2><button class="icon-btn" type="button" id="close-form" aria-label="Close">Close</button></div><section class="suggestions"><strong>Quick add · Pick a task</strong><div id="suggested-tasks" class="suggested-tasks"></div></section><label>Task name<input id="title" name="title" maxlength="120" required placeholder="e.g. Read 20 minutes"></label><label>Due date<input id="due" name="due" type="date" required></label><label>Reminder time<input id="time" name="time" type="time" value="09:00" required></label><label>Repeat<select id="repeat" name="repeat"><option value="none">One time</option><option value="daily">Every day (habit)</option></select></label><div class="form-actions"><button type="button" class="secondary" id="delete-btn" hidden>Delete</button><button type="submit" class="primary">Save task</button></div></form></dialog><script src="./push-config.js" defer></script><script src="./app.js" defer></script></body></html>
